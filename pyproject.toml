[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rag"
version = "0.1.0"
description = "Document knowledge-base agent: idempotent ingestion, hybrid retrieval, tool calling, human-in-the-loop write actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.5",
    "docx2txt>=0.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-chroma>=0.2",
    "langchain-core>=0.3.15",
    "langchain-deepseek>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
agent-rag = "agent_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer / FastAPI 的声明式默认值就是这个写法，B008 是误报
"src/agent_rag/cli.py" = ["B008"]
"src/agent_rag/api/app.py" = ["B008"]

