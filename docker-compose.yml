services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 向量库、SQLite、模型缓存都要持久化，否则容器一删全没
      - ./var:/app/var
      - ./data/raw:/app/data/raw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
